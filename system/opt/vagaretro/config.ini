# ============================================================================
# VagaRetro 原生前端配置 —— MINILOONG (pocket1, RK3566 / Debian 13 trixie)
#   改完这个文件不用重新注入镜像，重启前端即生效：
#       sudo systemctl restart emulationstation
#   所有键都在第一个 [ 之前 —— 启动器只解析这一段。
# ============================================================================

# 总开关：0 = 停用前端（屏幕上给提示后停住，不会进 ES）
enabled=1

# 渲染引擎：MINILOONG 上**只有 sdl 这一条**。
#   R36H/A10 那份配置里的 native(weston+GTK3/WebKitGTK) / cog / chromium
#   在这台机器的镜像里**依赖一个都没有**（没有 webkit2gtk、cog、chromium、
#   electron），写了也是白写。启动器会把任何别的值兜回 sdl 并记日志。
#   sdl = 原生 C + SDL2 前端，KMSDRM 直接吃 DRM/GBM，走 Mali-G52 的 GPU。
renderer=sdl

# 页面路径（只有网页系渲染路径用得上，sdl 不读这个文件）
page=

# --- 第二张 TF 卡（游戏卡 /roms + /bios）---
# 厂商的 Switch to SD2 for Roms.sh 里，MINILOONG 分支写的是 BLOCK="3"，
# 所以第二个卡槽是 /dev/mmcblk3p1（**不是 R36H 的 mmcblk1p1**）。
# 启动器会把它挂到 $rom2_dir（插上才挂，没插就跳过，不影响启动）。
rom2_dev=/dev/mmcblk3p1
rom2_dir=/roms2

# --- renderer=sdl 用的 ---
shell_python=/usr/bin/python3
# 可执行文件路径。留空 = /opt/vagaretro/native/vgfront。
sdl_bin=/opt/vagaretro/native/vgfront
# 扁平索引（由启动器在拉起界面前跑 `--gen-index` 刷新，每次开机刷一次）。
# 留空 = /opt/vagaretro/index.tsv。
sdl_index=/opt/vagaretro/index.tsv
# 附加命令行参数，原样拼在索引路径后面。留空即可。
sdl_args=

# ============================================================================
# 以下给 vagaretro-shell.py 读，别改 [shell] 这个节名
# ============================================================================
[shell]
# 前端页面（sdl 路径不读，保留只是为了宿主脚本的键查得到）
html=/opt/vagaretro/index.html
# LANGOS 的 system 定义（启动命令模板从这里来，也就是"直接调 Linux 的 RA"）
# MINILOONG 这份 es_systems.cfg 的 command 模板跟 R36H 完全同构：
#   sudo perfmax %GOVERNOR% %ROM%; nice -n -19 /usr/local/bin/retroarch \
#       -L /home/ark/.config/retroarch/cores/xxx_libretro.so %ROM%; sudo perfnorm
essys=/etc/emulationstation/es_systems.cfg
# ROM 所在分区（机器内那张卡的 ROMS 分区，首启格式化成 exFAT 后挂到 /roms）
rom_dir=/roms
# 第二张卡（TF2）上的 ROM 根。**优先于 rom_dir**：真正装满 ROM 的是这张卡。
# 目录名多数跟前端 platform.id 同名（FC/SFC/MD…），特例见宿主里的 ROM2_DIRNAME。
rom_dir2=/roms2
# 兼容符号链接树。作用是把前端的 platform.id（FC/SFC/PS1…）映射到 LANGOS 的
# 目录名（nes/snes/psx…）。根分区是 btrfs，支持软链，没问题。
compat_dir=/home/ark/.vagaretro-roms
# 前端请求启动游戏时，宿主把命令写到这里，由启动器负责执行。
# 必须在 /opt/vagaretro 下（属主 ark）：sdl 路径里宿主是 root，
# 落到 /tmp 的话带 sticky 位，ark 删不掉，同一个游戏会被反复启动。
request_file=/opt/vagaretro/launch.sh
# RetroArch 与核心目录。
# MINILOONG 的 /usr/local/bin/retroarch 是个包装脚本，里面再调
# /opt/retroarch/bin/retroarch -c /home/ark/.config/retroarch/retroarch.cfg。
# 核心：/home/ark/.config/retroarch/cores 有 269 个文件、
#       /home/ark/.config/retroarch32/cores 有 49 个。
# PS1 走的是 32 位那套，脚本会按 %EMULATOR% 自动换目录。
retroarch=/usr/local/bin/retroarch
ra_cores=/home/ark/.config/retroarch/cores
# 启动方式：
#   system = 用 es_systems.cfg 里 LANGOS 自己的 command（带 perfmax/perfnorm，最忠实）
#   direct = 直接拼 `retroarch -L <core>`（system 解析失败时自动退回这个）
launch_mode=system
# 全屏
fullscreen=1
# 调试：1 = 打开 WebKit 开发者工具（MINILOONG 没有 WebKit，无效果）
debug=0
# 性能探针：1 = 页面加载后自动量两段帧率写进日志。sdl 路径不适用，关着。
perf_probe=0
# 网页 console.log 转发（sdl 路径不适用），留着不影响
web_log=1
# 自定义 JS 探测文件，留空 = 不跑
probe_js_file=

# ---- 手柄 --------------------------------------------------------------
# 宿主**不走 gptokeyb**，而是直接读手柄的 evdev 节点，调前端自带的
# window.vagaPad(btn)。前端自己是 SDL2 程序，手柄由宿主统一转成界面事件。
pad_enabled=1
# 按 sysfs 里的设备名找 event 节点（编号会随枚举顺序变，写死 event2 迟早出事）。
pad_name=Gamepad
# 想钉死设备路径就填，例如 /dev/input/event2；留空 = 按 pad_name 自动找
pad_device=
# 左摇杆是否也当方向键用
pad_analog=1
# 摇杆死区，单位是轴量程(通常在 -32767~32767)的百分比。太低会有漂移自动乱走。
pad_deadzone_pct=40
# 长按方向键的自动重复：先等 pad_repeat_delay 毫秒，之后每 pad_repeat_rate 毫秒走一格。
pad_repeat_delay=420
pad_repeat_rate=160
# BTN_TRIGGER_HAPPY1..5（704~708）的语义每个厂不一样。
# 默认 704=select 705=start 706=mode 707=l3 708=r3。要改就写 代码:按钮名 的列表。
pad_extra_map=
