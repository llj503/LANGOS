# ============================================================================
#  vgboot.ini —— 「首次开机那屏」的显示参数
#
#  这个文件就在启动分区（vfat）上，插到 Windows 里直接就能改，
#  改完不用重新烘焙镜像。刷完机发现问题先看这里。
# ============================================================================

# 旋转。这台机器面板是 720x960 竖屏，内核 cmdline 里给了 fbcon=rotate:3
# （可见画面是 960x720 横屏），而 /dev/fb0 拿到的是没转过的原始帧缓冲，
# 所以渲染器得自己转回来。
#   auto = 竖屏 fb + 横屏底图时自动取 270
#   0 / 90 / 180 / 270 = 强制指定
#
# ⚠ 如果刷完发现画面躺了 / 上下颠倒，就改这个值重开机：
#     270 和 90 是"转反了"的一对；180 是上下颠倒。
rot=270

# 重画节流（秒）。这台一帧只要几毫秒（纯内存位运算），0.5 很稳。
interval=0.5

# 代码区字号。注释掉 = 按屏高自动（aarch64/960x720 上是 13）。
# 觉得字小可以调到 15~16，但行容量会跟着变少。
#fontsize=13
